# Site estático do CADEE (SPA do Vite) atrás do nginx do Dokku, que cuida do HTTPS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # o IP do aluno é dado pessoal e o nginx do Dokku já registra o acesso
    access_log off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # arquivos com hash no nome (gerados pelo Vite): cache longo
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";  # sem "always": 404 não fica em cache
        try_files $uri =404;
    }

    # a página do app nunca fica em cache: um deploy novo aparece na hora
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # rotas do React Router (/planejador, /disciplinas...) caem no index.html
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
