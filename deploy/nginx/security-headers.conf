# Cabeçalhos de segurança do site (equivalentes aos do netlify.toml). Incluído em cada location porque o
# nginx NÃO herda add_header quando a location define o seu próprio.
# __SIGAA_API_ORIGIN__ é trocado no build pela origem de VITE_SIGAA_API_URL (ver Dockerfile).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# começa em Report-Only (só avisa no console). Sem violações por alguns dias → troque por Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formigteen.github.io __SIGAA_API_ORIGIN__; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
